[env:esp32-s3-compile]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
  ../../
build_flags =
  -D LV_CONF_SKIP
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_MONTSERRAT_32=1
  -D BOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi
; Compile harness only. No board GPIOs or display driver are selected here.
