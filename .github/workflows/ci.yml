name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run check

  embedded-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frame-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frame-renderer/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CASTBOARD_BROWSER_TESTS: '1'

  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - run: pio run -d receivers/esp32/test/compile
      - run: python receivers/esp32/test/image_format.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag castboard:ci .
      - name: Start the image with fresh persistent storage
        run: |
          docker volume create castboard-ci-data
          docker run --detach --name castboard-ci --publish 127.0.0.1:8787:8787 \
            --mount type=volume,src=castboard-ci-data,dst=/data castboard:ci
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 --max-time 3 \
            http://127.0.0.1:8787/api/health
          docker exec castboard-ci sh -ec 'test "$(id -u)" != 0 && test -s "$CASTBOARD_CONFIG"'
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8787/ > /dev/null
      - if: failure()
        run: docker logs castboard-ci
      - if: always()
        run: |
          docker rm --force castboard-ci || true
          docker volume rm castboard-ci-data || true
