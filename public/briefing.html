<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0b0c0c">
  <title>Castboard Briefing</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="briefing-screen">
  <main class="briefing-shell">
    <header class="briefing-masthead">
      <div><span id="briefing-brand">Castboard</span><strong>Office Wire</strong></div>
      <time id="briefing-clock"></time>
    </header>
    <nav id="briefing-categories" class="briefing-categories" aria-label="Story categories"></nav>
    <section class="briefing-layout">
      <article id="briefing-lead" class="briefing-lead" aria-live="polite"></article>
      <aside class="briefing-wire">
        <header><strong>Headlines</strong><span id="briefing-count">0 stories</span></header>
        <div id="briefing-list" class="briefing-list"></div>
      </aside>
    </section>
    <footer class="briefing-footer">
      <div class="briefing-controls">
        <button id="briefing-read" type="button">Read</button>
        <button id="briefing-prev" type="button" aria-label="Previous story">‹</button>
        <button id="briefing-play" type="button" aria-label="Pause rotation">Ⅱ</button>
        <button id="briefing-next" type="button" aria-label="Next story">›</button>
      </div>
      <div class="ticker-window"><div id="briefing-ticker" class="ticker-track">Connecting to the briefing desk…</div></div>
      <div id="briefing-progress" class="briefing-progress"></div>
    </footer>
  </main>
  <dialog id="reader-dialog" class="reader-dialog">
    <article>
      <header><div><span id="reader-source"></span><h2 id="reader-title"></h2></div><button id="reader-close" type="button">Close</button></header>
      <div id="reader-body" class="reader-body"></div>
    </article>
  </dialog>
  <script type="module" src="/briefing.js"></script>
</body>
</html>
